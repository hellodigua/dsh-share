# DSH peers are installed from npm for local builds; a deployed profile still
# provides the runtime instances.
packages:
  - '.'
autoInstallPeers: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
nodeLinker: hoisted

# Keep transitive DSH peers on the same development baseline.
overrides:
  '@deepseek-ai/dsh-compaction': 0.1.5-rc.1
  '@deepseek-ai/dsh-output-retention': 0.1.5-rc.1
  '@deepseek-ai/dsh-agent': 0.1.5-rc.1
